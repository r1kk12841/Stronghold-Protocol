name: Native app release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test

  android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci --no-audit --no-fund
      - name: Build local-first web client
        run: npm run native:build
      - name: Sync Capacitor project
        run: npx cap sync android
      - name: Build installable debug APK
        working-directory: android
        env:
          SP_VERSION_NAME: ${{ github.ref_name }}
          SP_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Prepare Android release asset
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-assets/Stronghold-Protocol-Android-${GITHUB_REF_NAME}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-assets/*.apk
          if-no-files-found: error

  windows:
    name: Build Windows portable app
    needs: test
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Set package version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          npm version $version --no-git-tag-version
      - name: Build portable EXE
        run: npm run windows:dist
      - name: Prepare Windows release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $source = Get-ChildItem dist-windows -File -Filter '*.exe' | Select-Object -First 1
          if (-not $source) { throw 'electron-builder did not produce a portable EXE' }
          Copy-Item $source.FullName "release-assets/Stronghold-Protocol-Windows-${{ github.ref_name }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: release-assets/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish release and attach apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Stronghold Protocol ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
